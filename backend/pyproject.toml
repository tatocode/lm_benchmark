[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Web-based LLM inference performance benchmark tool"
readme = "README.md"
authors = [
    { name = "tatocode", email = "jianhuxiaoyao@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.1.3",
    "sse-starlette>=3.5.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
llm-benchmark = "llm_benchmark:main"
llm-bench = "llm_benchmark.cli:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
